services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql://openglass:openglass@db:5432/openglass
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openglass
      POSTGRES_PASSWORD: openglass
      POSTGRES_DB: openglass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
